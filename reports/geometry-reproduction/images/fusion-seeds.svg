<circle cx="486.0" cy="315.9" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
<circle cx="502.0" cy="408.8" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
<circle cx="518.0" cy="278.7" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
<circle cx="534.0" cy="213.6" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
<polygon points="510,261.9 521,272.9 510,283.9 499,272.9" fill="#17202a"/>
<text x="510" y="478" text-anchor="middle" class="label">Concat</text>
<text x="510" y="505" text-anchor="middle" class="value">mean 12.71%</text>
<circle cx="716.0" cy="278.7" r="7" fill="#ef6c35" fill-opacity=".68" class="point"/>
<circle cx="732.0" cy="325.2" r="7" fill="#ef6c35" fill-opacity=".68" class="point"/>
