<circle cx="716.0" cy="204.3" r="7" fill="#ef6c35" fill-opacity=".68" class="point"/>
<circle cx="732.0" cy="343.8" r="7" fill="#ef6c35" fill-opacity=".68" class="point"/>
<circle cx="748.0" cy="343.8" r="7" fill="#ef6c35" fill-opacity=".68" class="point"/>
<circle cx="764.0" cy="241.5" r="7" fill="#ef6c35" fill-opacity=".68" class="point"/>
<polygon points="740,272.3 751,283.3 740,294.3 729,283.3" fill="#17202a"/>
<text x="740" y="478" text-anchor="middle" class="label">Addition</text>
<text x="740" y="505" text-anchor="middle" class="value">mean 12.23%</text>
<text x="500" y="540" text-anchor="middle" class="note">IEA leads concat by 0.05 points and addition by 0.54 points—well within paired uncertainty.</text>
