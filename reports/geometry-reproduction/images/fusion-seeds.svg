<circle cx="256.0" cy="288.0" r="7" fill="#7e03a8" fill-opacity=".68" class="point"/>
<circle cx="272.0" cy="241.5" r="7" fill="#7e03a8" fill-opacity=".68" class="point"/>
<circle cx="288.0" cy="362.4" r="7" fill="#7e03a8" fill-opacity=".68" class="point"/>
<circle cx="304.0" cy="278.7" r="7" fill="#7e03a8" fill-opacity=".68" class="point"/>
<polygon points="280,260.7 291,271.7 280,282.7 269,271.7" fill="#17202a"/>
<text x="280" y="478" text-anchor="middle" class="label">IEA</text>
<text x="280" y="505" text-anchor="middle" class="value">mean 12.77%</text>
<circle cx="486.0" cy="288.0" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
<circle cx="502.0" cy="213.6" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
<circle cx="518.0" cy="241.5" r="7" fill="#31688e" fill-opacity=".68" class="point"/>
