<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<title>Fusion methods overlap across seeds</title>
<style>text{font-family:Inter,Arial,sans-serif;fill:#17202a}.title{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#667085}.axis{font-size:13px;fill:#667085}.label{font-size:15px;font-weight:600}.value{font-size:14px;font-weight:700}.note{font-size:13px;fill:#667085}.grid{stroke:#d8dee8;stroke-width:1}.zero{stroke:#17202a;stroke-width:2}.point{stroke:#fff;stroke-width:1.5}</style>
<rect width="1000" height="560" fill="#ffffff" rx="12"/>
<text x="40" y="42" class="title">Fusion methods overlap across seeds</text>
<text x="40" y="68" class="sub">Each dot is one training seed; diamonds mark the 8-seed mean on the same held-out scenes.</text>
<line x1="120" y1="440.0" x2="920" y2="440.0" class="grid"/>
<text x="98" y="445.0" text-anchor="end" class="axis">5%</text>
<line x1="120" y1="331.7" x2="920" y2="331.7" class="grid"/>
<text x="98" y="336.7" text-anchor="end" class="axis">10%</text>
<line x1="120" y1="223.3" x2="920" y2="223.3" class="grid"/>
<text x="98" y="228.3" text-anchor="end" class="axis">15%</text>
<line x1="120" y1="115.0" x2="920" y2="115.0" class="grid"/>
<text x="98" y="120.0" text-anchor="end" class="axis">20%</text>
<circle cx="256.0" cy="167.1" r="7" fill="#7e03a8" fill-opacity=".68" class="point"/>
<circle cx="272.0" cy="306.6" r="7" fill="#7e03a8" fill-opacity=".68" class="point"/>
